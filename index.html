<style>
:root{--felt:#0b5d3b;--felt2:#0e6d46;--wood:#5a3a1e;--ink:#1b1b1b;--tile:#fbf8f0;--gold:#f4c430;--txt:#fff;--muted:#cfe8da;--acc:#ffd54a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--wood);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.top{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#3e2713}
.top h1{font-size:18px;margin:0;flex:1;letter-spacing:.5px}
.sc{display:flex;gap:6px}
.sc div{background:#00000040;border-radius:10px;padding:4px 10px;text-align:center;min-width:74px}
.sc small{display:block;font-size:11px;color:#e8d9c4}
.sc b{font-size:20px}
.ib{background:#00000040;border:0;color:#fff;font-size:20px;width:40px;height:40px;border-radius:10px}
.table{flex:1;margin:4px 2px;border-radius:14px;background:radial-gradient(circle at 50% 45%,var(--felt2),var(--felt));border:4px solid #2d1b0c;position:relative;display:flex;flex-direction:column;min-height:0}
.seat{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px;padding:6px 10px}
.seat.on{color:var(--acc);font-weight:700}
.seat .bk{display:flex;gap:2px}
.seat .bk i{width:9px;height:16px;background:#e9e2cf;border-radius:2px;display:block;box-shadow:inset 0 0 0 1px #0004}
.row{display:flex;justify-content:space-between;align-items:center}
.side{position:absolute;bottom:4px;flex-direction:column;align-items:flex-start;gap:3px;z-index:2;padding:4px 6px}
.side.l{left:0}.side.r{right:0;align-items:flex-end}
.side .bk{flex-wrap:wrap;max-width:80px}
#board svg{width:100%;height:100%;display:block}
#board{flex:1;padding-bottom:52px!important;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:2px 0;overflow:hidden;min-height:0;min-width:0}
#board .bw{display:flex;flex-direction:column;gap:4px}
#board .br{display:flex;align-items:center;gap:3px}
#board .br.rv{justify-content:flex-end}
.t{display:inline-flex;background:var(--tile);border-radius:6px;box-shadow:0 2px 0 #0005,inset 0 0 0 1px #0003;flex:none}
.t.v{flex-direction:column}
.hf{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:12%}
.hf span{border-radius:50%;margin:auto;width:70%;height:70%}
.hf span.p{background:var(--ink)}
#board .hf span{width:78%;height:78%}
#board .t{border-radius:5px}
.t .ln{background:#0006;flex:none}
.t.h .ln{width:1.5px}.t.v .ln{height:1.5px}
.t.last{box-shadow:0 0 0 3px var(--acc),0 2px 0 #0005}
#msg{text-align:center;font-size:15px;min-height:42px;padding:4px 12px;display:flex;align-items:center;justify-content:center;background:#00000030}
#ends{display:flex;gap:8px;justify-content:center;padding:6px}
#ends button,.btn{background:var(--gold);color:#3a2a00;border:0;border-radius:12px;padding:12px 16px;font-size:16px;font-weight:700}
.btn.sec{background:#ffffff26;color:#fff}
#hand{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px 6px 12px;background:#3e2713;min-height:96px}
#hand .t{transition:transform .15s}
#hand .t.ok{box-shadow:0 0 0 3px var(--acc),0 3px 0 #0006;transform:translateY(-6px)}
#hand .t.no{opacity:.45}
#hand .t.sel{box-shadow:0 0 0 4px #4fc3f7,0 3px 0 #0006;transform:translateY(-10px)}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov[hidden]{display:none}
.card{background:#fffaf0;color:#222;border-radius:18px;padding:18px;max-width:420px;width:100%;max-height:90vh;overflow:auto}
.card h2{margin:0 0 8px;font-size:20px;color:var(--felt)}
.card p,.card li{font-size:15px;line-height:1.45}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card .acts .btn{flex:1}
.card .btn.sec{background:#ece6da;color:#3a2a00}
#puntas{text-align:center;font-size:14px;color:#cfe8da;padding:2px 0 4px}
#puntas b{display:inline-block;min-width:26px;padding:2px 8px;margin:0 4px;border-radius:8px;background:#ffffff26;color:#fff;font-size:16px}
.card table{width:100%;border-collapse:collapse;font-size:14px}
.card td,.card th{padding:4px 6px;border-bottom:1px solid #ddd;text-align:left}
.opt{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee;font-size:15px}
.opt select{font-size:15px;padding:6px;border-radius:8px}
.big{font-size:34px;text-align:center;margin:6px 0}
</style>

<body>
<div id="instalar" hidden style="background:#f4c430;color:#3a2a00;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:15px">
  <span style="flex:1" id="instTxt">Instala el Dominó en tu teléfono: queda como app y funciona sin internet.</span>
  <button id="instBtn" style="background:#0b5d3b;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:16px;font-weight:700">📲 Instalar</button>
  <button id="instX" aria-label="Cerrar" style="background:transparent;border:0;font-size:20px;color:#3a2a00">✕</button>
</div>
<div class="top">
  <h1>🁫 Dominó</h1>
  <div class="sc"><div><small>Nosotros</small><b id="sA">0</b></div><div><small>Ellos</small><b id="sB">0</b></div></div>
  <button class="ib" id="bMenu" aria-label="Menú">☰</button>
</div>
<div class="table">
  <div class="row"><div class="seat" id="p2"></div></div>
  <div class="row" style="flex:1;min-height:0;align-items:stretch;position:relative">
    <div class="seat side l" id="p3"></div>
    <div id="board"></div>
    <div class="seat side r" id="p1"></div>
  </div>
  <div id="puntas"></div>
  <div id="msg">Bienvenido</div>
</div>
<div id="ends"></div>
<div id="hand"></div>

<div class="ov" id="ov" hidden><div class="card" id="card"></div></div>

<script>
"use strict";
const NAMES=["Tú","Derecha","Compañero","Izquierda"];
const META_DEF=100;
const PIP={0:[],1:[4],2:[2,6],3:[2,4,6],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
let S; // estado
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let CFG=load("dom_cfg",{meta:META_DEF,vel:"normal",nivel:"bueno"});
let STATS=load("dom_stats",{jugadas:0,ganadas:0,zapatos:0});
const speed=()=>({lento:1300,normal:850,rapido:450})[CFG.vel]||850;

/* ---------- dibujo ---------- */
function half(n,s){let h='<div class="hf" style="width:'+s+'px;height:'+s+'px">';for(let i=0;i<9;i++)h+='<span class="'+(PIP[n].includes(i)?'p':'')+'"></span>';return h+'</div>'}
function tileHTML(a,b,s,vert,extra){return '<div class="t '+(vert?'v':'h')+' '+(extra||'')+'">'+half(a,s)+'<div class="ln"></div>'+half(b,s)+'</div>'}

/* ---------- reglas ---------- */
function newDeck(){const t=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)t.push([i,j]);for(let i=t.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[t[i],t[j]]=[t[j],t[i]]}return t}
const pts=h=>h.reduce((s,t)=>s+t[0]+t[1],0);
function fits(t,L,R){if(L===null)return (S&&S.first&&!(t[0]===6&&t[1]===6))?[]:["R"];const o=[];if(t[0]===L||t[1]===L)o.push("L");if((t[0]===R||t[1]===R)&&!(L===R&&o.length))o.push("R");return o}

function newGame(){S={score:[0,0],hand:null,starter:null,first:true,hist:[],over:false};save("dom_game",S);startHand()}
function startHand(){
  const d=newDeck();
  const H=[0,1,2,3].map(p=>d.slice(p*7,p*7+7).sort((a,b)=>(b[0]+b[1])-(a[0]+a[1])));
  let turn;
  if(S.first){turn=H.findIndex(h=>h.some(t=>t[0]===6&&t[1]===6))}
  else{turn=(S.starter+1)%4}
  S.hand={H,B:[],L:null,R:null,turn,passes:0,done:false,last:-1,starter:turn,played:[]};
  S.starter=turn;
  persist();render();
  if(S.first){say(NAMES[turn]+(turn===0?" tienes":" tiene")+" el doble seis y "+(turn===0?"sales":"sale")+".")}
  else say((turn===0?"Te toca salir a ti.":"Sale "+NAMES[turn]+"."));
  loop();
}
function persist(){save("dom_game",S)}

function play(p,i,side){
  const h=S.hand,t=h.H[p].splice(i,1)[0];
  if(h.L===null){h.B=[[t[0],t[1]]];h.L=t[0];h.R=t[1];h.o=0}
  else if(side==="L"){const x=t[1]===h.L?[t[0],t[1]]:[t[1],t[0]];h.B.unshift(x);h.L=x[0];h.o=(h.o||0)+1}
  else{const x=t[0]===h.R?[t[0],t[1]]:[t[1],t[0]];h.B.push(x);h.R=x[1]}
  h.passes=0;h.last=side==="L"?0:h.B.length-1;h.lastSide=side;h.played.push({p,t});
  S.first=false;
  if(!h.H[p].length){endHand(p,"domino");return true}
  return false;
}
function endHand(p,tipo){
  const h=S.hand;h.done=true;
  const team=p%2;
  const rivalPlayers=team===0?[1,3]:[0,2];
  const sum=rivalPlayers.reduce((s,q)=>s+pts(h.H[q]),0);
  S.score[team]+=sum;
  S.hist.push({gana:team,pts:sum,tipo,quien:p});
  h.result={team,sum,tipo,p};
  persist();render(true);
  const meta=CFG.meta;
  if(S.score[0]>=meta||S.score[1]>=meta){finishGame();return}
  showHandEnd();
}
function tranque(){
  const h=S.hand,tot=h.H.map(pts),m=Math.min(...tot);
  const low=[0,1,2,3].filter(i=>tot[i]===m);
  const teams=[...new Set(low.map(i=>i%2))];
  if(teams.length===1){endHand(low[0],"tranque");return}
  const pair=[tot[0]+tot[2],tot[1]+tot[3]];
  if(pair[0]!==pair[1]){const t=pair[0]<pair[1]?0:1;endHand(low.find(i=>i%2===t),"tranque");return}
  h.done=true;S.hist.push({gana:-1,pts:0,tipo:"tranque empatado"});h.result={team:-1,sum:0,tipo:"empate"};persist();render(true);showHandEnd();
}

/* ---------- jugadores del teléfono ---------- */
function aiChoose(p){
  const h=S.hand,my=h.H[p],opts=[];
  my.forEach((t,i)=>fits(t,h.L,h.R).forEach(s=>opts.push({i,s,t})));
  if(!opts.length)return null;
  if(CFG.nivel==="facil")return opts[Math.floor(Math.random()*opts.length)];
  const partner=(p+2)%4, next=(p+1)%4;
  let best=null;
  for(const o of opts){
    let L=h.L,R=h.R,t=o.t;
    if(L===null){L=t[0];R=t[1]}
    else if(o.s==="L")L=(t[1]===L?t[0]:t[1]);else R=(t[0]===R?t[1]:t[0]);
    const rest=my.filter((_,k)=>k!==o.i);
    let v=t[0]+t[1];
    if(t[0]===t[1])v+=8;                                   // salir de los dobles
    const keep=rest.filter(r=>r[0]===L||r[1]===L||r[0]===R||r[1]===R).length;v+=keep*3; // quedar con juego
    const cnt=n=>rest.filter(r=>r[0]===n||r[1]===n).length; v+= (cnt(L)+cnt(R))*1.5; // dominar el número
    // castigar números que el siguiente rival no ha tenido (pasó) — favorecer
    const passed=h.passedOn||{};
    if((passed[next]||[]).includes(L)||(passed[next]||[]).includes(R))v+=6;
    if((passed[partner]||[]).includes(L)&&(passed[partner]||[]).includes(R))v-=4;
    if(!best||v>best.v)best={...o,v};
  }
  return best;
}
function notePass(p){const h=S.hand;h.passedOn=h.passedOn||{};h.passedOn[p]=[...new Set([...(h.passedOn[p]||[]),h.L,h.R])]}

let running=false;
async function loop(){
  if(running)return;running=true;
  try{
    while(S.hand&&!S.hand.done){
      const h=S.hand,p=h.turn;
      render();
      if(p===0){
        if(h.L!==null&&!h.H[0].some(t=>fits(t,h.L,h.R).length)){
          say("No llevas: pasas.");await sleep(speed()+300);
          notePass(0);h.passes++;h.played.push({p:0,pase:true});
          if(h.passes>=4){tranque();break}
          h.turn=1;persist();continue;
        }
        say(h.L===null?(S.first?"Sal con el doble seis.":"Sales tú: toca cualquier ficha."):"Tu turno: toca una ficha resaltada.");
        break; // espera al toque del usuario
      }
      await sleep(speed());
      if(h.done)break;
      const c=aiChoose(p);
      if(!c){say(NAMES[p]+" pasa.");notePass(p);h.passes++;h.played.push({p,pase:true});
        if(h.passes>=4){await sleep(speed());tranque();break}
        h.turn=(p+1)%4;persist();continue}
      const t=h.H[p][c.i];
      const fin=play(p,c.i,c.s);
      say(NAMES[p]+" juega "+t[0]+"|"+t[1]+".");
      if(fin)break;
      if(h.passes>=4){tranque();break}
      h.turn=(p+1)%4;persist();
    }
  }finally{running=false;if(S.hand&&!S.hand.done)render()}
}
let pending=null,viewing=null;
function userTap(i){
  const h=S.hand;if(!h||h.done||h.turn!==0||running)return;
  const t=h.H[0][i],f=fits(t,h.L,h.R);if(!f.length){say("Esa no entra. Busca una resaltada.");return}
  if(f.length===2&&h.L!==h.R){pending=i;render();say("¿Por qué punta la pones?");return}
  doUser(i,f[0]);
}
function doUser(i,s){
  pending=null;const h=S.hand,t=h.H[0][i];
  const fin=play(0,i,s);say("Jugaste "+t[0]+"|"+t[1]+".");
  if(fin)return;
  h.turn=1;persist();loop();
}

/* ---------- pantalla ---------- */
function say(m){$("msg").textContent=m}
function seat(p,reveal){
  const h=S.hand,on=h&&!h.done&&h.turn===p;
  const n=h?h.H[p].length:0;
  let inner;
  if(reveal&&h){inner='<span style="display:flex;flex-wrap:wrap;gap:2px;max-width:150px">'+(h.H[p].map(t=>miniTile(t[0],t[1])).join("")||"sin fichas")+'</span>'}
  else inner='<span class="bk">'+'<i></i>'.repeat(n)+'</span>';
  return '<span>'+NAMES[p]+'</span>'+inner;
}
/* ---------- mesa: salida en el centro, 4 fichas por lado y luego en S ---------- */
let BOUND=9.15; // media anchura de la mesa en unidades (1 unidad = media ficha); se ajusta a la pantalla
function chainRects(h){
  const B=h.B,o=h.o||0,out=[];
  const c=B[o],cd=c[0]===c[1];
  const cr=cd?{x:-.5,y:-1,w:1,h:2}:{x:-1,y:-.5,w:2,h:1};
  out.push({k:o,r:cr,a:c[0],b:c[1],d:cd,first:"L"});
  const arm=(side)=>{ // side "R" o "L"
    const R=side==="R";
    let vlen=0,dir=R?"R":"L",cx=R?cr.x+cr.w:cr.x,cy=0,n=0,last=cd?cr:(R?{x:0,y:-.5,w:1,h:1}:{x:-1,y:-.5,w:1,h:1}),vdir=R?"D":"U",hdirs=R?["R","L"]:["L","R"],hi=0;
    const ks=[];if(R)for(let k=o+1;k<B.length;k++)ks.push(k);else for(let k=o-1;k>=0;k--)ks.push(k);
    for(const k of ks){
      const t=B[k],d=t[0]===t[1],near=R?t[0]:t[1],far=R?t[1]:t[0];
      const along=d?1:2;
      const horiz=dir==="R"||dir==="L";
      let turn=false;
      if(horiz&&n>0){if(dir==="R"&&cx+along>BOUND)turn=true;if(dir==="L"&&cx-along<-BOUND)turn=true}
      if(!horiz&&vlen>=2)turn=true;
      if(turn){
        const nd=horiz?vdir:hdirs[(++hi)%2];
        if(nd==="D"){cx=last.x+last.w/2;cy=last.y+last.h}
        else if(nd==="U"){cx=last.x+last.w/2;cy=last.y}
        else if(nd==="L"){cx=last.x;cy=last.y+last.h/2}
        else{cx=last.x+last.w;cy=last.y+last.h/2}
        dir=nd;n=0;vlen=0;
      }
      const th=d?2:1;let r;
      if(dir==="R")r={x:cx,y:cy-th/2,w:along,h:th};
      else if(dir==="L")r={x:cx-along,y:cy-th/2,w:along,h:th};
      else if(dir==="D")r={x:cx-th/2,y:cy,w:th,h:along};
      else r={x:cx-th/2,y:cy-along,w:th,h:along};
      out.push({k,r,a:near,b:far,d,first:dir==="R"?"L":dir==="L"?"R":dir==="D"?"T":"B"});
      // siguiente punto de contacto y última mitad
      if(dir==="R"){cx=r.x+r.w;last=d?r:{x:r.x+1,y:r.y,w:1,h:1}}
      else if(dir==="L"){cx=r.x;last=d?r:{x:r.x,y:r.y,w:1,h:1}}
      else if(dir==="D"){cy=r.y+r.h;last=d?r:{x:r.x,y:r.y+1,w:1,h:1}}
      else{cy=r.y;last=d?r:{x:r.x,y:r.y,w:1,h:1}}
      n++;if(dir==="U"||dir==="D")vlen+=along;
    }
  };
  arm("R");arm("L");
  return out;
}
const PXY={0:[],1:[[.5,.5]],2:[[.27,.27],[.73,.73]],3:[[.25,.25],[.5,.5],[.75,.75]],4:[[.27,.27],[.73,.27],[.27,.73],[.73,.73]],5:[[.25,.25],[.75,.25],[.5,.5],[.25,.75],[.75,.75]],6:[[.28,.22],[.72,.22],[.28,.5],[.72,.5],[.28,.78],[.72,.78]]};
function pipsSVG(n,x,y,rot){return PXY[n].map(([u,v])=>{if(rot){const t=u;u=v;v=t}return '<circle cx="'+(x+u).toFixed(3)+'" cy="'+(y+v).toFixed(3)+'" r="0.125"/>'}).join("")}
function renderBoard(h){
  const el=$("board");
  if(!h.B.length){el.innerHTML='<span style="color:#cfe8da;opacity:.7;margin:auto">Mesa vacía</span>';return}
  // probar varios anchos de fila y quedarse con el que da las fichas más grandes
  const cw=el.clientWidth||300,ch=Math.max(120,(el.clientHeight||300)-54);
  const UMAX=52; // px máximos por unidad (media ficha): evita fichas gigantes en pantallas grandes
  let best=null;
  for(const bd of [9.15,8.15,7.15,6.15,5.15,4.15]){
    BOUND=bd;const its=chainRects(h);
    let a=1e9,b=-1e9,c=1e9,d=-1e9;
    its.forEach(i=>{a=Math.min(a,i.r.x);b=Math.max(b,i.r.x+i.r.w);c=Math.min(c,i.r.y);d=Math.max(d,i.r.y+i.r.h)});
    const P=.3,w=b-a+2*P,hh=d-c+2*P,sc=Math.min(cw/w,ch/hh,cw/9,UMAX);
    if(!best||sc>best.sc*1.04)best={sc,its,x0:a-P,y0:c-P,w,hh};
  }
  const items=best.its,x0=best.x0,y0=best.y0,W=best.w,y1=y0+best.hh;
  let g='';
  for(const it of items){
    const r=it.r,wide=r.w>r.h;
    let ax=r.x,ay=r.y,bx=r.x,by=r.y;
    if(wide){if(it.first==="R"){ax=r.x+1}else{bx=r.x+1}}
    else{if(it.first==="B"){ay=r.y+1}else{by=r.y+1}}
    const hl=it.k===h.last;
    g+='<g><rect x="'+(r.x+.1)+'" y="'+(r.y+.13)+'" width="'+(r.w-.14)+'" height="'+(r.h-.14)+'" rx=".14" fill="#00000055"/>';
    g+='<rect x="'+(r.x+.07)+'" y="'+(r.y+.07)+'" width="'+(r.w-.14)+'" height="'+(r.h-.14)+'" rx=".14" fill="'+(hl?"#fff6c8":"#fbf8f0")+'" stroke="'+(hl?"#ffb300":"#1e1e1e")+'" stroke-width="'+(hl?.14:.06)+'"/>';
    g+=wide?'<line x1="'+(r.x+1)+'" y1="'+(r.y+.14)+'" x2="'+(r.x+1)+'" y2="'+(r.y+r.h-.14)+'" stroke="#555" stroke-width=".035"/>'
           :'<line x1="'+(r.x+.14)+'" y1="'+(r.y+1)+'" x2="'+(r.x+r.w-.14)+'" y2="'+(r.y+1)+'" stroke="#555" stroke-width=".035"/>';
    g+='<g fill="#111">'+pipsSVG(it.a,ax,ay,wide)+pipsSVG(it.b,bx,by,wide)+'</g></g>';
  }
  el.innerHTML='<svg style="width:'+Math.min(cw,W*UMAX)+'px;height:'+Math.min(ch,(y1-y0)*UMAX)+'px" viewBox="'+x0+' '+y0+' '+W+' '+(y1-y0)+'" preserveAspectRatio="xMidYMid meet" shape-rendering="geometricPrecision">'+g+'</svg>';
}
function render(reveal){
  $("sA").textContent=S.score[0];$("sB").textContent=S.score[1];
  const h=S.hand;if(!h)return;
  for(const p of[1,2,3]){const el=$("p"+p);el.innerHTML=seat(p,reveal);el.classList.toggle("on",!h.done&&h.turn===p)}
  // tamaño de fichas según cantidad
  renderBoard(h);
  $("puntas").innerHTML=h.L===null?"":"Puntas: ◀<b>"+h.L+"</b>·<b>"+h.R+"</b>▶";
  const my=h.H[0], myTurn=!h.done&&h.turn===0&&!running;
  $("hand").innerHTML=my.map((t,i)=>{
    const ok=myTurn&&fits(t,h.L,h.R).length;
    const cls=(pending===i?"sel":ok?"ok":(myTurn?"no":""));
    return '<div data-i="'+i+'">'+tileHTML(t[0],t[1],30,true,cls)+'</div>'}).join("");
  if(viewing&&h.done){$("ends").innerHTML='<button id="bCont">Continuar ▶</button>';$("bCont").onclick=()=>{const v=viewing;viewing=null;$("ends").innerHTML="";v==="game"?showGameEnd():showHandEnd()};return}
  $("ends").innerHTML=pending!==null?'<button data-s="L">◀ Punta del '+h.L+'</button><button data-s="R">Punta del '+h.R+' ▶</button>':"";
}
$("hand").addEventListener("click",e=>{const d=e.target.closest("[data-i]");if(d)userTap(+d.dataset.i)});
$("ends").addEventListener("click",e=>{const s=e.target.dataset.s;if(s&&pending!==null)doUser(pending,s)});
window.addEventListener("resize",()=>S&&render(S.hand&&S.hand.done));

/* ---------- ventanas ---------- */
function open(html){$("card").innerHTML=html;$("ov").hidden=false}
function close(){$("ov").hidden=true}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov"&&!S.hand.done)close()});
function miniTile(a,b){
  return '<svg viewBox="0 0 2 1" width="44" height="22" style="margin:1px;vertical-align:middle"><rect x=".03" y=".03" width="1.94" height=".94" rx=".12" fill="#fbf8f0" stroke="#333" stroke-width=".04"/><line x1="1" y1=".12" x2="1" y2=".88" stroke="#666" stroke-width=".04"/><g fill="#111">'+pipsSVG(a,0,0,true)+pipsSVG(b,1,0,true)+'</g></svg>'}
function handDetail(){
  const h=S.hand,r=h.result||{},tot=h.H.map(pts);
  const pair=(team,ps,label)=>{
    const sum=ps.reduce((x,q)=>x+tot[q],0),won=r.team===team;
    return '<div style="border:2px solid '+(won?'#2e8b3e':'#ddd')+';border-radius:12px;padding:8px 10px;margin:8px 0;background:'+(won?'#eef8ef':'#fff')+'">'+
      '<div style="display:flex;justify-content:space-between;font-weight:700"><span>'+label+(won?' 🏆 ganan':'')+'</span><span>'+sum+' pts</span></div>'+
      ps.map(q=>'<div style="display:flex;align-items:center;gap:6px;margin-top:6px;flex-wrap:wrap"><span style="min-width:86px;'+(q===r.p?'font-weight:700;color:#2e8b3e':'')+'">'+NAMES[q]+(q===r.p?(r.tipo==="tranque"?' (menos)':' (dominó)'):'')+'</span>'+
        (h.H[q].length?h.H[q].map(t=>miniTile(t[0],t[1])).join(''):'<i style="color:#888">sin fichas</i>')+
        '<span style="margin-left:auto;font-weight:700">'+tot[q]+'</span></div>').join('')+'</div>';
  };
  return pair(0,[0,2],"Nosotros")+pair(1,[1,3],"Ellos");
}
function showHandEnd(){
  const r=S.hand.result;let title,txt;
  if(r.team===-1){title="Tranque empatado";txt="Nadie anota en esta mano."}
  else{
    const quien=r.team===0?"¡Ganamos la mano!":"Ellos ganan la mano";
    title=(r.tipo==="domino"?"¡Dominó! ":"¡Tranque! ")+quien;
    txt=(r.tipo==="domino"?NAMES[r.p]+(r.p===0?" dominaste":" dominó")+".":"Nadie pudo jugar. "+NAMES[r.p]+" tiene menos puntos en la mano.")+" "+(r.team===0?"Nosotros":"Ellos")+" se llevan los puntos de los rivales: <b>"+r.sum+"</b>.";
  }
  open('<h2>'+title+'</h2><p>'+txt+'</p>'+handDetail()+'<p>Nosotros <b>'+S.score[0]+'</b> · Ellos <b>'+S.score[1]+'</b> (meta '+CFG.meta+')</p><div class="acts"><button class="btn" id="bNext">Siguiente mano</button><button class="btn sec" id="bSee">Ver la mesa</button></div>');
  $("bNext").onclick=()=>{close();viewing=null;$("ends").innerHTML="";startHand()};
  $("bSee").onclick=()=>{close();viewing="hand";say("Así quedó la mesa. Toca Continuar cuando termines.");render(true)};
}
function finishGame(){
  const win=S.score[0]>S.score[1]?0:1, lose=1-win, zap=S.score[lose]===0;
  STATS.jugadas++;if(win===0)STATS.ganadas++;if(zap&&win===0)STATS.zapatos++;save("dom_stats",STATS);
  S.over=true;persist();showGameEnd();
}
function showGameEnd(){
  const win=S.score[0]>S.score[1]?0:1, lose=1-win, zap=S.score[lose]===0;
  open('<div class="big">'+(win===0?"🏆":"😓")+'</div><h2 style="text-align:center">'+(win===0?"¡Ganamos la partida!":"Ellos ganan la partida")+'</h2>'+
    (zap?'<p style="text-align:center;font-size:18px"><b>'+(win===0?"¡Les pusimos zapatero!":"Nos pusieron zapatero…")+'</b></p>':"")+
    '<p style="text-align:center">Nosotros <b>'+S.score[0]+'</b> · Ellos <b>'+S.score[1]+'</b></p><p style="margin:10px 0 0"><b>Última mano</b></p>'+handDetail()+'<div class="acts"><button class="btn" id="bNew">Nueva partida</button><button class="btn sec" id="bSee2">Ver la mesa</button></div>');
  $("bNew").onclick=()=>{close();viewing=null;$("ends").innerHTML="";newGame()};
  $("bSee2").onclick=()=>{close();viewing="game";say("Así quedó la mesa. Toca Continuar cuando termines.");render(true)};
}
$("bMenu").onclick=()=>{
  const rows=S.hist.slice(-10).reverse().map((x,k)=>'<tr><td>'+(S.hist.length-k)+'</td><td>'+(x.gana===0?"Nosotros":x.gana===1?"Ellos":"—")+'</td><td>'+x.tipo+'</td><td>'+x.pts+'</td></tr>').join("");
  open('<h2>Menú</h2>'+
  '<div class="opt">Partida a <select id="cMeta">'+[50,100,150,200].map(v=>'<option '+(CFG.meta==v?"selected":"")+'>'+v+'</option>').join("")+'</select></div>'+
  '<div class="opt">Velocidad <select id="cVel"><option value="lento">Lenta</option><option value="normal">Normal</option><option value="rapido">Rápida</option></select></div>'+
  '<div class="opt">Rivales <select id="cNiv"><option value="facil">Fáciles</option><option value="bueno">Buenos</option></select></div>'+
  (rows?'<p style="margin-bottom:4px"><b>Manos de esta partida</b></p><table><tr><th>#</th><th>Gana</th><th>Cómo</th><th>Pts</th></tr>'+rows+'</table>':"")+
  '<p style="font-size:13px;color:#555">Partidas: '+STATS.jugadas+' · Ganadas: '+STATS.ganadas+' · Zapateros dados: '+STATS.zapatos+'</p>'+
  '<div class="acts"><button class="btn" id="bClose">Seguir jugando</button><button class="btn sec" id="bRules">Reglas</button><button class="btn sec" id="bNG">Nueva partida</button></div>');
  $("cVel").value=CFG.vel;$("cNiv").value=CFG.nivel;
  const upd=()=>{CFG={meta:+$("cMeta").value,vel:$("cVel").value,nivel:$("cNiv").value};save("dom_cfg",CFG)};
  ["cMeta","cVel","cNiv"].forEach(id=>$(id).onchange=upd);
  $("bClose").onclick=()=>{close();if(S.hand.done&&!S.over&&!viewing)showHandEnd()};
  $("bNG").onclick=()=>{if(S.over||S.score[0]+S.score[1]===0){close();newGame();return}
    open('<h2>¿Nueva partida?</h2><p>Se pierde la partida actual (Nosotros '+S.score[0]+' · Ellos '+S.score[1]+').</p><div class="acts"><button class="btn" id="bYes">Sí, empezar otra</button><button class="btn sec" id="bNo">No, seguir</button></div>');
    $("bYes").onclick=()=>{close();viewing=null;$("ends").innerHTML="";newGame()};$("bNo").onclick=()=>{close();if(S.hand.done&&!S.over)showHandEnd()}};
  $("bRules").onclick=rules;
};
function rules(){open('<h2>Reglas</h2><ul>'+
 '<li>Se juega en <b>parejas</b>: tú y tu compañero (arriba) contra Derecha e Izquierda.</li>'+
 '<li>Cada jugador recibe <b>7 fichas</b>. El turno gira hacia la <b>derecha</b>.</li>'+
 '<li>En la primera mano sale quien tenga el <b>doble seis</b>. En las siguientes, la salida pasa al jugador de la derecha del que salió antes.</li>'+
 '<li>Si no llevas ficha que entre, <b>pasas</b>.</li>'+
 '<li><b>Dominó:</b> quien se queda sin fichas gana la mano; su pareja se lleva los puntos de las fichas que les quedan a los <b>rivales</b>.</li>'+
 '<li><b>Tranque:</b> si nadie puede jugar, gana la pareja del jugador con <b>menos puntos</b> en la mano y se lleva los puntos de los rivales.</li>'+
 '<li>Gana la primera pareja que llegue a la meta (100 por defecto). Si la otra pareja no anotó nada, es <b>zapatero</b>.</li></ul>'+
 '<div class="acts"><button class="btn" id="bOk">Entendido</button></div>');$("bOk").onclick=()=>{close();if(S.hand.done&&!S.over)showHandEnd()}}

/* ---------- inicio ---------- */
(function init(){
  const g=load("dom_game",null);
  if(g&&g.hand&&!g.over){S=g;render(S.hand.done);
    if(S.hand.done)showHandEnd();else{say("Seguimos la partida.");loop()}}
  else{newGame();if(!load("dom_vio_reglas",false)){save("dom_vio_reglas",true);rules()}}
})();

/* ---------- instalar como app ---------- */
(function(){
  const bar=document.getElementById("instalar"),btn=document.getElementById("instBtn"),txt=document.getElementById("instTxt");
  const yaInstalada=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(yaInstalada)return;
  let ev=null;
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;bar.hidden=false});
  btn.onclick=async()=>{
    if(ev){ev.prompt();const r=await ev.userChoice;ev=null;if(r.outcome==="accepted")bar.hidden=true}
    else{txt.innerHTML=/iPhone|iPad/i.test(navigator.userAgent)?"En el iPhone: toca <b>Compartir</b> (el cuadrito con flecha) y luego <b>Agregar a inicio</b>.":"Toca los <b>tres puntos ⋮</b> de Chrome y luego <b>Instalar app</b> o <b>Agregar a pantalla principal</b>.";btn.hidden=true}
  };
  document.getElementById("instX").onclick=()=>bar.hidden=true;
  // si en 3 segundos el teléfono no ofreció el botón automático, mostrar instrucciones
  if(location.protocol.startsWith("http"))setTimeout(()=>{if(!ev&&!yaInstalada){bar.hidden=false}},3000);
  window.addEventListener("appinstalled",()=>{bar.hidden=true});
})();
</script>
